name: Verify application and catalog runners

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55440
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-public-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-public-key
      SUPABASE_URL: http://127.0.0.1:55440
      SUPABASE_SECRET_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Check application and runner contracts
        run: npm run verify
      - name: Replay migrations and database regressions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: local-test-password
          PGDATABASE: catalog_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-local.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic_catalog_offers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/paginated_catalog.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/peripheral_reclassification.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/adaptive_payment_conditions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/complete_computer_categories.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/apu_accessory_categories.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/shared_feed_claims.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/idempotent_catalog_completion.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/catalog_inventory_discovery.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_detail_fallback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bounded_catalog_queue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/network_thermal_categories.sql
          node --test supabase/tests/catalog-concurrency.test.mjs
      - name: Verify browser behavior with isolated data
        run: npm run test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
