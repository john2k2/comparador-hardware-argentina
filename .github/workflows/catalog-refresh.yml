name: Catalog refresh scheduler
run-name: Catalog ${{ github.event_name == 'schedule' && (github.event.schedule == '5 5 * * *' && 'priority' || 'guides') || inputs.mode || 'tracked' }} / ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de refresh
        required: true
        default: tracked
        type: choice
        options:
          - tracked
          - hot
          - full
          - cleanup-history
          - custom
          - demand
          - guides
          - priority
      trigger:
        description: Origen de la solicitud (para evidencia operativa)
        type: choice
        options: [manual, cloudflare-fallback]
        default: manual
      query:
        description: Query opcional para mode=custom
        required: false
        type: string
      categories:
        description: CSV de categorias opcional para mode=custom
        required: false
        type: string
      stores:
        description: CSV de stores opcional
        required: false
        type: string
      max_queries:
        description: Override opcional de maxQueries
        required: false
        type: string
      stale_minutes:
        description: Override opcional de staleMinutes
        required: false
        type: string
  schedule:
    # Guías cada hora (renueva solo ofertas con >=90 min); muestra fija una vez al día.
    # Repositorio público y runner estándar. Sin ampliar la ventana comprable de 3 h.
    # GitHub puede retrasar cron: medir tiempos reales, no prometer esta cadencia.
    - cron: '5 5 * * *'
    - cron: '17 0-4,6-23 * * *'

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve refresh target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_QUERY: ${{ github.event.inputs.query }}
          INPUT_CATEGORIES: ${{ github.event.inputs.categories }}
          INPUT_STORES: ${{ github.event.inputs.stores }}
          INPUT_MAX_QUERIES: ${{ github.event.inputs.max_queries }}
          INPUT_STALE_MINUTES: ${{ github.event.inputs.stale_minutes }}
        run: |
          set -euo pipefail

          url_encode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1"
          }

          append_param() {
            local current="$1"
            local key="$2"
            local value="$3"

            if [[ -z "$value" ]]; then
              printf '%s' "$current"
              return
            fi

            printf '%s&%s=%s' "$current" "$key" "$(url_encode "$value")"
          }

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$EVENT_SCHEDULE" in
              '5 5 * * *')
                MODE='priority'
                REQUEST_PATH='/api/admin/catalog-refresh/priority?sample=1'
                ;;
              '17 0-4,6-23 * * *')
                MODE='guides'
                REQUEST_PATH='/api/admin/catalog-refresh/priority'
                ;;
              *)
                echo "Cron no soportado: $EVENT_SCHEDULE" >&2
                exit 1
                ;;
            esac
          else
            MODE="${INPUT_MODE:-tracked}"

            case "$MODE" in
              priority)
                REQUEST_PATH='/api/admin/catalog-refresh/priority?sample=1'
                ;;
              guides)
                REQUEST_PATH='/api/admin/catalog-refresh/priority'
                ;;
              tracked)
                REQUEST_PATH='/api/admin/catalog-refresh?mode=tracked'
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'maxQueries' "${INPUT_MAX_QUERIES:-30}")"
                ;;
              hot)
                REQUEST_PATH='/api/admin/catalog-refresh?mode=hot'
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'maxQueries' "${INPUT_MAX_QUERIES:-1}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'staleMinutes' "${INPUT_STALE_MINUTES:-180}")"
                ;;
              demand)
                REQUEST_PATH='/api/admin/catalog-refresh?mode=demand'
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'maxQueries' "${INPUT_MAX_QUERIES:-30}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'staleMinutes' "${INPUT_STALE_MINUTES:-180}")"
                ;;
              full)
                REQUEST_PATH='/api/admin/catalog-refresh?mode=full'
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'maxQueries' "${INPUT_MAX_QUERIES:-}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'staleMinutes' "${INPUT_STALE_MINUTES:-}")"
                ;;
              cleanup-history)
                REQUEST_PATH='/api/admin/catalog-refresh?mode=cleanup-history'
                ;;
              custom)
                if [[ -z "${INPUT_QUERY:-}" && -z "${INPUT_CATEGORIES:-}" ]]; then
                  echo 'mode=custom requiere query o categories' >&2
                  exit 1
                fi

                REQUEST_PATH='/api/admin/catalog-refresh?mode=custom'
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'query' "${INPUT_QUERY:-}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'categories' "${INPUT_CATEGORIES:-}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'stores' "${INPUT_STORES:-}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'maxQueries' "${INPUT_MAX_QUERIES:-}")"
                REQUEST_PATH="$(append_param "$REQUEST_PATH" 'staleMinutes' "${INPUT_STALE_MINUTES:-}")"
                ;;
              *)
                echo "Modo manual no soportado: $MODE" >&2
                exit 1
                ;;
            esac
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE path=$REQUEST_PATH"

      - name: Start local refresh runtime
        if: steps.resolve.outputs.mode != 'priority' && steps.resolve.outputs.mode != 'guides'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CATALOG_REFRESH_CRON_SECRET: ${{ secrets.CATALOG_REFRESH_CRON_SECRET }}
          CATALOG_REQUESTED_RUNNER: '1'
          DISABLE_INTERNAL_BACKGROUND_REFRESH: '1'
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ENABLE_JEV_OFFER_REVIEW: ${{ vars.ENABLE_JEV_OFFER_REVIEW || '0' }}
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3101 > "$RUNNER_TEMP/catalog-refresh-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/catalog-refresh-runtime.pid"

          for attempt in {1..30}; do
            if curl --silent --fail --max-time 5 'http://127.0.0.1:3101/api/categories' > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/catalog-refresh-runtime.log"
          exit 1

      - name: Run catalog refresh
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CATALOG_REFRESH_CRON_SECRET }}
          REQUEST_PATH: ${{ steps.resolve.outputs.request_path }}
          MODE: ${{ steps.resolve.outputs.mode }}
          CATALOG_RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CATALOG_REQUESTED_RUNNER: '1'
          DISABLE_INTERNAL_BACKGROUND_REFRESH: '1'
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ENABLE_JEV_OFFER_REVIEW: ${{ vars.ENABLE_JEV_OFFER_REVIEW || '0' }}
        run: |
          set -euo pipefail

          # El scraping corre en GitHub Actions. Así la petición pública del
          # Worker no asume el costo de 17 fuentes externas ni su límite de CPU.
          BASE_URL='http://127.0.0.1:3101'

          if [[ -z "$CRON_SECRET" ]]; then
            echo 'Falta definir CATALOG_REFRESH_CRON_SECRET como repo secret.' >&2
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          echo "REFRESH_WINDOW_START=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          if [[ "$MODE" == 'priority' || "$MODE" == 'guides' ]]; then
            STATUS_CODE=200
            node scripts/run-catalog-refresh.mjs "$MODE" "$RESPONSE_FILE" || STATUS_CODE=503
          else
          STATUS_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 1800 \
              --request POST \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CRON_SECRET" \
              "${BASE_URL%/}${REQUEST_PATH}"
          )"

          fi

          cp "$RESPONSE_FILE" "$RUNNER_TEMP/catalog-refresh-result.json"
          echo "HTTP ${STATUS_CODE}"
          cat "$RESPONSE_FILE"
          echo

          STATUS_CODE="$STATUS_CODE" RESPONSE_FILE="$RESPONSE_FILE" MODE="$MODE" python3 - <<'PY'
          import json
          import os
          import sys

          status = int(os.environ["STATUS_CODE"])
          response_file = os.environ["RESPONSE_FILE"]
          mode = os.environ["MODE"]

          if status < 200 or status >= 300:
              print(f"Request failed with HTTP {status}", file=sys.stderr)
              sys.exit(1)

          raw = open(response_file, encoding="utf-8").read().strip()
          try:
              payload = json.loads(raw) if raw else {}
          except json.JSONDecodeError as exc:
              print(f"Response was not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if mode in ('priority', 'guides'):
              if payload.get('source') != 'priority-known-offers':
                  sys.exit('Respuesta prioritaria inválida')
              print(f"Priority: attempted={payload.get('attempted')} observed={payload.get('observed')} comparable={payload.get('comparable')}")
              if payload.get('deadlineReached') or payload.get('sampleTruncated'):
                  sys.exit('Cobertura incompleta por límite; conservar evidencia y revisar el alcance')
              if payload.get('missingGuideSlots'):
                  print('::warning::Hay piezas de guías sin oferta comparable: ' + ', '.join(payload['missingGuideSlots']))
              if payload.get('attempted', 0) > 0 and payload.get('observed', 0) == 0:
                  sys.exit('No se persistió ninguna observación prioritaria')
              sys.exit(0)

          if mode == "cleanup-history":
              cleanup = payload.get("cleanup") or {}
              deleted = cleanup.get("deletedRows")
              retained = cleanup.get("retainedRows", cleanup.get("remainingRows"))
              print(f"Cleanup summary: deletedRows={deleted} retainedRows={retained}")
              sys.exit(0)

          failed = payload.get("failedTargets")
          ok = payload.get("okTargets")
          total = payload.get("totalTargets")
          source = payload.get("source")

          print(f"Refresh summary: source={source} totalTargets={total} okTargets={ok} failedTargets={failed}")

          if isinstance(failed, int) and failed > 0:
              recovered_empty_demand = (
                  payload.get('fallbackReason') == 'demand-returned-no-products'
                  and isinstance(ok, int) and ok > 0
                  and all(item.get('ok') or item.get('error') == 'NO_PRODUCTS_REFRESHED' for item in payload.get('results', []))
              )
              if recovered_empty_demand:
                  print('::warning::La demanda no obtuvo productos; la consulta de recuperación sí obtuvo resultados. Revisar el resumen por tienda.')
              else:
                  sys.exit(1)
          PY

      - name: Record omitted global report for guides
        if: always() && steps.resolve.outputs.mode == 'guides'
        run: |
          node scripts/lib/freshness-report-policy.mjs \
            "$RUNNER_TEMP/catalog-refresh-result.json" \
            "$RUNNER_TEMP/catalog-freshness.json"

      - name: Measure global window updates and store freshness
        if: always() && steps.resolve.outputs.mode != 'guides' && steps.resolve.outputs.mode != 'cleanup-history' && env.REFRESH_WINDOW_START != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          EXTRA=()
          EXTRA+=(--require-observed)
          if [[ "$MODE" == "priority" ]]; then EXTRA+=(--runner-result "$RUNNER_TEMP/catalog-refresh-result.json"); fi
          node scripts/catalog-freshness-report.mjs \
            --mode "$MODE" \
            --since "$REFRESH_WINDOW_START" \
            --sample docs/reports/crecimiento-2026-09-12/G02-MUESTRA-PRIORITARIA.json \
            "${EXTRA[@]}" \
            --output "$RUNNER_TEMP/catalog-freshness.json"

      - name: Preserve freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-freshness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-freshness.json
            ${{ runner.temp }}/catalog-refresh-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop local refresh runtime
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/catalog-refresh-runtime.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/catalog-refresh-runtime.pid")" || true
          fi

      - name: Show local runtime log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/catalog-refresh-runtime.log" || true

  telemetry-maintenance:
    needs: refresh
    # Sólo primer intento del diario natural; un rerun de GitHub conserva el evento original.
    if: ${{ always() && github.event_name == 'schedule' && github.run_attempt == '1' && github.event.schedule == '5 5 * * *' && needs.refresh.outputs.mode == 'priority' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEMETRY_RETENTION_MODE: ${{ vars.TELEMETRY_RETENTION_MODE || 'inspect' }}
      TELEMETRY_RETENTION_APPROVAL_ID: ${{ vars.TELEMETRY_RETENTION_APPROVAL_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect or maintain backed telemetry
        shell: bash
        run: |
          set -euo pipefail
          ARGS=("$TELEMETRY_RETENTION_MODE" --batch-size 250 --max-batches 4
            --deadline-ms 120000 --max-stored-bytes 5242880
            --out "$RUNNER_TEMP/telemetry-maintenance.json")
          if [[ "$TELEMETRY_RETENTION_MODE" == 'archive-retire' ]]; then
            ARGS+=(--approval-id "$TELEMETRY_RETENTION_APPROVAL_ID")
          fi
          node scripts/telemetry-maintenance.mjs "${ARGS[@]}"

      - name: Preserve aggregate maintenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/telemetry-maintenance.json
          if-no-files-found: warn
          retention-days: 30
