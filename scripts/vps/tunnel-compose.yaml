name: comparador-catalog
services:
  tunnel:
    image: cloudflare/cloudflared@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    container_name: comparador-catalog-tunnel
    command: [tunnel, --no-autoupdate, run, --token-file, /run/private/tunnel-token]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./secrets/tunnel-token:/run/private/tunnel-token:ro
    networks: [web_egress]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  web_egress:
    external: true
    name: comparador_web_egress
