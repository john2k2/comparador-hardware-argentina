pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream catalog_rest {
    zone catalog_rest 64k;
    server rest:3000 resolve;
    keepalive 8;
  }
  server {
    listen 8080;
    client_max_body_size 4m;
    location /rest/v1/ {
      proxy_pass http://catalog_rest/;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
      # PostgREST incluye la consulta en Content-Location; los lotes de IDs
      # del catálogo pueden superar el buffer de cabecera predeterminado.
      proxy_buffer_size 16k;
      proxy_buffers 4 16k;
      proxy_busy_buffers_size 32k;
    }
    location / { return 404; }
  }
}
