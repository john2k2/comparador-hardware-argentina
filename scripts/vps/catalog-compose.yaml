name: comparador-catalog
services:
  database:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: comparador-catalog-db
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - database_admin_password
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - catalog_private
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_parameter_max_length_on_error=0
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, postgres, -d, catalog]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  catalog_data:
    name: comparador_catalog_pgdata
networks:
  catalog_private:
    name: comparador_catalog_private
    internal: true
secrets:
  database_admin_password:
    file: ./secrets/database-admin-password
